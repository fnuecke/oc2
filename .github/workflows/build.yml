name: build

on:
  pull_request:
  push:
    branches: [ '**' ]

jobs:
  build:
    strategy:
      matrix:
        java: [ 21 ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Build with Gradle
        run: ./gradlew build
      - name: Run game tests
        run: ./gradlew gameTest
      - name: Upload game test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gametest-results-${{ matrix.os }}
          path: '*/build/test-results/gameTest/*.xml'
          if-no-files-found: error
          retention-days: 1
