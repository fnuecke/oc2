name: manual

on:
  push:
    branches: [ '1.21.1' ]
    paths:
      - '.github/workflows/manual.yml'
      - 'tools/manual-html/**'
      - 'common/src/main/resources/assets/oc2/**'
      - 'common/src/generated/resources/assets/oc2/**'
      - 'gradle/libs.versions.toml'
  pull_request:
    paths:
      - '.github/workflows/manual.yml'
      - 'tools/manual-html/**'
      - 'common/src/main/resources/assets/oc2/**'
      - 'common/src/generated/resources/assets/oc2/**'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Cache Cargo Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/manual-html/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/manual-html/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache Minecraft Client JAR
        uses: actions/cache@v4
        with:
          path: ~/.cache/oc2-manual-html
          key: minecraft-client-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: minecraft-client-
      - name: Render Manual
        run: cargo run --release --locked --manifest-path tools/manual-html/Cargo.toml -- --clean --output build/manual-html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/manual-html

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: manual-html-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
