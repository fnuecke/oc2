name: pages

on:
  push:
    branches: [ '1.21.1' ]
    paths:
      - '.github/workflows/pages.yml'
      - 'tools/manual-html/**'
      - 'common/src/main/resources/assets/oc2/**'
      - 'common/src/generated/resources/assets/oc2/**'
      - '*/src/main/java/li/cil/oc2/api/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'tools/manual-html/**'
      - 'common/src/main/resources/assets/oc2/**'
      - 'common/src/generated/resources/assets/oc2/**'
      - '*/src/main/java/li/cil/oc2/api/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Cache Cargo Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/manual-html/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/manual-html/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache Minecraft Client JAR
        uses: actions/cache@v4
        with:
          path: ~/.cache/oc2-manual-html
          key: minecraft-client-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: minecraft-client-
      - name: Render Manual
        run: cargo run --release --locked --manifest-path tools/manual-html/Cargo.toml -- --clean --output build/pages/manual
      - name: Generate Javadoc
        run: ./gradlew apiJavadoc
      - name: Assemble Pages
        run: |
          cp -r build/docs/api-javadoc build/pages/javadoc
          cat > build/pages/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>OpenComputers II</title>
          <meta http-equiv="refresh" content="0; url=manual/">
          <link rel="canonical" href="manual/">
          <a href="manual/">OpenComputers II Manual</a>
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
