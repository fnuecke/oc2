name: publish

on:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mc_version: ${{ steps.split_tag.outputs.mc_version }}
      mod_version: ${{ steps.split_tag.outputs.mod_version }}

    steps:
      - uses: actions/checkout@v7

      - name: Extract Version from Tag
        id: split_tag
        run: |
          tag=${{ github.event.release.tag_name }}
          parts=(${tag//\// })
          echo "mc_version=${parts[0]}" >> $GITHUB_OUTPUT
          echo "mod_version=${parts[1]}" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Build with Gradle
        run: ./gradlew -PmodVersion='${{ steps.split_tag.outputs.mod_version }}' build

      - name: Remove shadow JARs
        run: |
          rm fabric/build/libs/*-dev-shadow.jar
          rm neoforge/build/libs/*-dev-shadow.jar

      - name: Add Artifacts to Github Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' \
            ./fabric/build/libs/*.jar \
            ./neoforge/build/libs/*.jar \
            --clobber

      - uses: actions/upload-artifact@v7
        name: Upload Artifacts
        id: upload-artifacts
        with:
          name: jar-files
          path: |
            ./fabric/build/libs/*.jar
            ./neoforge/build/libs/*.jar
          retention-days: 1

  publish:
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, neoforge ]
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: jar-files

      - name: Check out the static Maven repository
        uses: actions/checkout@v4
        with:
          repository: fnuecke/maven
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          path: maven

      - name: Publish (${{ matrix.loader }})
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          name: ${{ github.event.repository.name }}-MC${{ needs.build.outputs.mc_version }}-${{ needs.build.outputs.mod_version }}
          version: MC${{ needs.build.outputs.mc_version }}-${{ matrix.loader }}-${{ needs.build.outputs.mod_version }}
          java: Java 21

          files: ${{ matrix.loader }}/build/libs/*.jar

          fail-mode: skip

          modrinth-token: ${{ secrets.MODRINTH_API_KEY }}
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Publish to the static Maven repository
        working-directory: buildroot
        run: >-
          ./gradlew publish
          -Psemver="$VERSION"
          -PbuildrootDockerImage="$BUILDROOT_DOCKER_IMAGE"
          -PmavenRepoDir="${{ github.workspace }}/maven"

      - name: Commit and push the static Maven repository
        working-directory: maven
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "oc2 $VERSION"
          git push
