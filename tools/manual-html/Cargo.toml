[package]
name = "manual-html"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
fancy-regex = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
kurbo = "0.13"
minijinja = "2.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
ureq = "3.4"
write-fonts = "0.53"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
